<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Stream Overlay Master</title>
    <style>
        /* Base 1080p Canvas */
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: transparent;
            overflow: hidden;
            position: relative;
        }

        /* Generic iFrame reset */
        iframe {
            border: none;
            position: absolute;
            background-color: transparent;
        }

        /* 1. Top Left: Image Slideshow */
        .slideshow {
            position: absolute;
            top: 30px;    /* Reduced to close the 48px top gap */
            left: 30px;   /* Reduced to close the 48px left gap */
            width: 470px; 
            height: 80px;
            z-index: 10;
        }
        .slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            opacity: 0;
            animation: crossfade 18s infinite;
        }
        /* 6-second intervals for a 3-image cycle */
        .slideshow img:nth-child(1) { animation-delay: 0s; }
        .slideshow img:nth-child(2) { animation-delay: 6s; }
        .slideshow img:nth-child(3) { animation-delay: 12s; }

        @keyframes crossfade {
            0% { opacity: 0; }
            5% { opacity: 1; }
            33% { opacity: 1; }
            38% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* 2. Top Center: Bits Counter */
        .bits-counter {
            top: 30px;   /* Reduced to close the 48px top gap */
            left: 50%;
            transform: translateX(-50%);
            width: 405px; 
            height: 80px;
            z-index: 10;
        }

        /* 3. Top Right: Subs Counter */
        .subs-counter {
            top: 30px;    /* Reduced to close the 48px top gap */
            right: 22px;  /* Pushed out to close the 58px right gap */
            width: 405px; 
            height: 80px;
            z-index: 10;
        }

        /* 4. Bottom Left: Alert Box */
        .alert-box {
            bottom: 30px; /* Reduced to match the top boundary */
            left: 30px;   /* Reduced to close the 48px left gap */
            width: 800px;
            height: 600px;
            z-index: 50; 
        }

        /* 5. Bottom Center: Streamer Songlist */
        .songlist {
            bottom: 30px; /* Reduced to match the top boundary */
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 150px;
            z-index: 10;
        }

        /* 6. Bottom Right: Donation Goal */
        .donation-goal {
            bottom: 30px;  /* Reduced to match the top boundary */
            right: 22px;   /* Pushed out to close the 58px right gap */
            width: 500px;
            height: 150px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 1. Slideshow: Place these 3 image files in the same folder as this HTML file -->
    <div class="slideshow">
        <img src="orcamind.png" alt="@orcamind">
        <img src="michelleheafy.png" alt="@michelleheafy">
        <img src="josiaheverhart.png" alt="@josiaheverhart">
    </div>

    <!-- 2. Bits Counter -->
    <iframe class="bits-counter" src="https://streamlabs.com/widgets/bit-goal?token=A4EA3B61BD741E1F6A38" allowtransparency="true"></iframe>

    <!-- 3. Subs Counter -->
    <iframe class="subs-counter" src="https://streamlabs.com/widgets/sub-goal?token=A4EA3B61BD741E1F6A38" allowtransparency="true"></iframe>

    <!-- 4. Alert Box -->
    <iframe class="alert-box" src="https://streamlabs.com/alert-box/v3/A4EA3B61BD741E1F6A38" allowtransparency="true"></iframe>

    <!-- 5. Streamer Songlist -->
    <iframe class="songlist" src="https://boozinwalsh.github.io/songtitles/" allowtransparency="true"></iframe>

    <!-- 6. Donation Goal -->
    <iframe class="donation-goal" src="https://streamlabs.com/widgets/donation-goal?token=A4EA3B61BD741E1F6A38" allowtransparency="true"></iframe>

</body>
</html>
